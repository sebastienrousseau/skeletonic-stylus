name: Skeletonic Stylus Release

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm test

      - name: Install Playwright Chromium for a11y test
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Upload package artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: skeletonic-stylus-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: skeletonic-stylus-package
          path: .

      - name: Extract tarball for publish
        run: |
          mkdir -p dist
          tar -xzf *.tgz --strip-components=1 -C dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist --access public --provenance

      - name: Verify CDN availability (jsDelivr + unpkg)
        # Polls both CDNs until they serve a 200 for the just-published
        # version, or fails after a 5 min timeout. Catches the rare case
        # where npm publish succeeds but the package doesn't propagate
        # to the CDN. Inlined so the publish job doesn't need a repo
        # checkout — `dist/package.json` from the artefact has the name
        # and version we need.
        run: |
          node -e '
          const { name, version } = require("./dist/package.json");
          const urls = [
            `https://unpkg.com/${name}@${version}/css/core/skeletonic.min.css`,
            `https://unpkg.com/${name}@${version}/css/core/skeletonic-ui.min.css`,
            `https://cdn.jsdelivr.net/npm/${name}@${version}/css/core/skeletonic.min.css`,
            `https://cdn.jsdelivr.net/npm/${name}@${version}/css/core/skeletonic-ui.min.css`,
          ];
          (async () => {
            const deadline = Date.now() + 5 * 60 * 1000;
            const failures = [];
            for (const url of urls) {
              let ok = false;
              while (Date.now() < deadline) {
                try {
                  const r = await fetch(url, { method: "HEAD" });
                  if (r.ok) { console.log(`✓ ${r.status} ${url}`); ok = true; break; }
                } catch {}
                await new Promise(r => setTimeout(r, 5000));
              }
              if (!ok) { console.error(`✗ timeout ${url}`); failures.push(url); }
            }
            if (failures.length) process.exit(1);
            console.log("All CDN URLs are live.");
          })();
          '

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: '*.tgz'
