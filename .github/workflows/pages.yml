name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install pnpm
      # `standalone` installs @pnpm/exe, which bundles its own Node. Recent
        # pnpm 10.x needs Node >= 22.13 at runtime (it uses node:sqlite) even
        # though its `engines` field still claims >= 18.12, so on the Node 20
        # leg of the matrix a normal install cannot run. Bundling decouples the
        # package manager from the Node version under test, which is the whole
        # point of testing several.
        uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a  # v6
        with:
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for a11y test
        run: pnpm exec playwright install --with-deps chromium

      # Installs `ssg` (cargo-ssg) pinned in mise.toml. Without it on PATH the
      # build falls back to the committed index.html, whose generated assets the
      # fallback never produces, and the a11y gate fails.
      - name: Install ssg from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
