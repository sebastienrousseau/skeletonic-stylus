<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="#hero" aria-label="{{name}} Home">
      <img src="{{site_path}}assets/logo.svg" alt="{{name}} skull logo" class="brand-logo" width="32" height="32" />
      <span class="brand-text">{{name}}</span>
    </a>
    <button
      class="nav-toggle"
      id="navToggle"
      type="button"
      aria-expanded="false"
      aria-controls="navMenu"
      aria-label="Toggle navigation menu"
    >
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle-icon" aria-hidden="true">☰</span>
    </button>
    <nav class="nav-menu" id="navMenu" aria-label="Main Navigation">
      <a class="nav-link" href="#overview">Overview</a>
      <a class="nav-link" href="#showcase">Showcase</a>
      <a class="nav-link" href="#components">Components</a>
      <a class="nav-link" href="#motion">Motion UI</a>
      <a class="nav-link" href="#dialogs">Dialogs</a>
      <a class="nav-link" href="#faq">FAQ</a>
    </nav>
    <div class="header-actions">
      <!-- Search trigger slot. The generator replaces this element with
           the search button (see SEARCH_SLOT_ATTR in src/plugins/search.rs);
           with no slot the button is position:fixed in the viewport corner
           and cannot align with this header. -->
      <span data-ssg-search></span>
      <button
        class="theme-toggle"
        id="mode-toggle"
        type="button"
        data-label-light="{{label_theme_light}}"
        data-label-dark="{{label_theme_dark}}"
      >
        <span class="visually-hidden">{{label_theme}}</span>
        <span class="visually-hidden" id="mode-state" data-label-system="{{label_theme_system}}">{{label_theme_system}}</span>
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
      <a class="btn btn-outline btn-sm" href="https://github.com/sebastienrousseau/skeletonic-stylus" target="_blank" rel="noopener noreferrer" aria-label="View {{name}} on GitHub">GitHub</a>
      <a class="btn btn-primary btn-sm" href="#quickstart">Quick Start</a>
    </div>
  </div>
</header>
