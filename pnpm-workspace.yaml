packages:
  - '.'

overrides:
  baseline-browser-mapping@<2.11.0: ">=2.11.0 <3.0.0"
  brace-expansion@<1.1.21: ">=1.1.21 <2.0.0"
  brace-expansion@>=2.0.0 <2.1.7: ">=2.1.7 <3.0.0"
  brace-expansion@>=3.0.0 <5.0.12: ">=5.0.12 <6.0.0"
  braces@<3.0.3: ">=3.0.3 <4.0.0"
  browserslist@<=4.28.6: ">=4.28.7 <5.0.0"
  colord@<2.9.4: ">=2.9.4 <3.0.0"
  fast-uri@<3.1.9: ">=3.1.9 <4.0.0"
  flatted@<3.4.2: ">=3.4.2 <4.0.0"
  js-yaml@<3.14.2: ">=3.14.2 <4.0.0"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5.0.0"
  js-yaml@>=5.0.0 <5.4.1: ">=5.4.1 <6.0.0"
  lodash@<4.18.0: ">=4.18.0 <5.0.0"
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11.0.1, with no backport
  # to older majors. Every consumer here uses the Minimatch class or the
  # named minimatch export, which 11 keeps.
  minimatch: "^11.0.1"
  # GHSA-3g3m-2fjr-6pw4 covers glob 9 to 14.0.1. stylint pinned glob 7.0.4,
  # which cannot run on minimatch 11 (GLOBSTAR is a Symbol there), so
  # patches/stylint@2.0.0.patch moves it to globSync and a direct Minimatch
  # for its exclude rules.
  glob: "^14.0.2"
  mout@<=1.2.4: ">=1.2.4 <2.0.0"
  nanoid@<3.3.18: ">=3.3.18 <4.0.0"
  picomatch@<2.3.2: ">=2.3.2 <3.0.0"
  postcss-selector-parser@>=7.0.0 <7.1.6: ">=7.1.6 <8.0.0"
  postcss@<8.4.31: ">=8.4.31 <9.0.0"
  source-map-js@<1.2.2: ">=1.2.2 <2.0.0"
  yargs-parser@<=5.0.0: ">=5.0.1 <6.0.0"
packageExtensions:
  stylint@2.0.0:
    dependencies:
      minimatch: "^11.0.1"
patchedDependencies:
  stylint@2.0.0: patches/stylint@2.0.0.patch
